plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    //id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"

    id 'io.realm.kotlin'

    ///id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.lora.cn"
    compileSdkVersion 35
    ndkVersion '25.1.8937393'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        applicationId "com.lora.cn"
        minSdkVersion 24
        multiDexEnabled true  // 添加这行
        // 临时兼容：为避免 Android 12+ PendingIntent 标志崩溃，降低 targetSdkVersion
        // 正式修复建议使用 hannesa2 修补库或在 AlarmPingSender 中添加 FLAG_IMMUTABLE
        targetSdkVersion 35
        versionCode 100002
        versionName "1.0.2"
    }

    signingConfigs {// 自动化打包配置
        release {// 开发环境
            keyAlias 'keystore'
            keyPassword '123456'
            storeFile file('D:\\work\\jack-keystore.jks')
            storePassword '123456'
        }
        debug {// 开发环境
            keyAlias 'keystore'
            keyPassword '123456'
            storeFile file('D:\\work\\jack-keystore.jks')
            storePassword '123456'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            //代码混淆需要添加的

            //useProguard true//代码压缩设置
            shrinkResources false//是否启用缩减资源
            //读取代码压缩配置文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/INDEX.LIST',
                    'META-INF/DEPENDENCIES',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/io.netty.versions.properties',
                    'META-INF/versions/**'
            ]
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'


    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation "io.github.cymchad:BaseRecyclerViewAdapterHelper4:4.1.4"

    // 网络与解析库（第三方交互）
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'

    // MQTT Android 服务（原版Paho）。注意：在targetSdk 31+上会触发PendingIntent标志限制
    // 已通过临时降低 targetSdkVersion 规避；推荐后续改为使用修补库
    implementation 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'
    // Add AndroidX LocalBroadcastManager to satisfy rewritten reference by Jetifier
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'io.moquette:moquette-broker:0.16'
    
    // EventBus
    implementation 'org.greenrobot:eventbus:3.3.1'

    implementation  'io.github.scwang90:refresh-layout-kernel:3.0.0-alpha'      //核心必须依赖
    implementation  'io.github.scwang90:refresh-header-classics:3.0.0-alpha'    //经典刷新头
    implementation  'io.github.scwang90:refresh-header-radar:3.0.0-alpha'       //雷达刷新头
    implementation  'io.github.scwang90:refresh-header-falsify:3.0.0-alpha'     //虚拟刷新头
    implementation  'io.github.scwang90:refresh-header-material:3.0.0-alpha'    //谷歌刷新头
    implementation  'io.github.scwang90:refresh-header-two-level:3.0.0-alpha'   //二级刷新头
    implementation  'io.github.scwang90:refresh-footer-ball:3.0.0-alpha'        //球脉冲加载
    implementation  'io.github.scwang90:refresh-footer-classics:3.0.0-alpha'    //经典加载
}
